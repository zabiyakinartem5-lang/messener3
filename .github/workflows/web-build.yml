name: Verify web client build
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'public/styles.css'
      - 'package.json'
      - '.github/workflows/web-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node --check server/index.js && node --check server/db.js
      - run: node -e "require('./server/index.js')"
